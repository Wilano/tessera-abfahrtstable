# The manifest: who made the plugin, what it may do, and what the Tessera app shows. It holds no code and no words:
# every name, label and hint below is a key into translations/<language>.json, part "app". docs/MANIFEST.md has every
# field. The tile belongs to a Home Assistant sensor (a template helper, see the README) that already merged, filtered
# and sorted the departures of one or more line+destination pairs into a few short lists; the tile only draws them and
# counts down on the screen's own clock.
id: abfahrtstable
version: 1.1.0
api: "0.7"
icon: bus
maintainer: wilano
license: MIT
stage: beta
topics: [travel]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 10

tiles:
  - id: board
    name: tile_name
    icon: bus
    sizes: { min: 1x1, max: 3x3 }
    memory: 1600
    # The tile is placed on a sensor whose attributes already hold the board as parallel short lists (the helper of the
    # README builds them). `has_attributes` offers only such a sensor in the inspector; `attributes` are the lists the
    # tile gets. Lists of texts and numbers come whole (docs/MANIFEST.md); that is why the helper exposes parallel
    # lists, not a list of objects (objects do not come through).
    domains: [sensor]
    has_attributes: [ats]
    attributes: [ats, lines, tos, delays, stale]
    example: tile_example
    # How the editor draws the tile from its data (it cannot run the C++): the sensor's name as the title and its state
    # string as the value. The live tile instead draws a row per departure and counts down.
    preview: { title: "{name}", value: "{state}" }
    options:
      - { id: header, kind: toggle, default: true, label: header, hint: header_hint }
      - { id: late, kind: toggle, default: true, label: late, hint: late_hint }
      # How the departure time reads: minutes only (default), the time of day, or both. One choice, so it never lands on
      # the meaningless "neither" two independent toggles could.
      - id: time_format
        kind: choice
        default: minutes
        choices:
          - { value: minutes, label: tf_minutes }
          - { value: clock, label: tf_clock }
          - { value: both, label: tf_both }
        label: time_format
        hint: time_format_hint
      - { id: max_rows, kind: number, min: 0, max: 8, step: 1, unit: row, default: 0, label: max_rows, hint: max_rows_hint }
